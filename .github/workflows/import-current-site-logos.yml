name: Import current site company logos

on:
  push:
    branches:
      - website-v2
    paths:
      - ".github/workflows/import-current-site-logos.yml"
      - "scripts/import-current-site-logos.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-logos:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website-v2
        uses: actions/checkout@v4
        with:
          ref: website-v2
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Import logos from current site
        run: node scripts/import-current-site-logos.mjs

      - name: Commit imported logos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/logos src/data/companyLogos.ts
          if git diff --cached --quiet; then
            echo "No logo changes to commit."
          else
            git commit -m "Import company logos from current website"
            git push origin website-v2
          fi
