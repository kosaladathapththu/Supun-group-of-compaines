<!doctype html><html><head><style>body{margin:0;background:#111;color:#fff;font:16px sans-serif}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px}.item{position:relative}.item span{position:absolute;left:8px;top:8px;z-index:2;background:#000b;padding:5px 8px;border-radius:5px}.item video{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}</style></head><body><div class="grid" id="grid"></div><script>for(const t of [0,5,10,15,20,25,30,35]){const item=document.createElement('div');item.className='item';item.innerHTML=`<span>${t}s</span><video muted preload="auto" src="/src/assets/supun-group-hero-optimized.mp4#t=${t}"></video>`;document.querySelector('#grid').append(item)}</script></body></html>
